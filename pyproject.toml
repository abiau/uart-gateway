[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uart-gateway"
version = "0.2.0"
description = "最小單 UART TCP Shell Gateway"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
server = ["pyserial>=3.5,<4"]

[project.scripts]
uart-client = "client:main"
uart-server = "server:main"

[tool.setuptools]
py-modules = ["server", "client", "protocol"]
