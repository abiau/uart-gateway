# Win11 COM3 接收驗證：使用者已確認只接 TX／RX／GND，115200／8N1，無流控。
# 此設定只授予 read；不會傳送 UART 命令，也不能 Confirm 或取得 TX Lease。
[network]
bind_host = "127.0.0.1"
port = 18081

[gateway]
lifecycle_timeout_ms = 10000

[[channels]]
id = "ch_uart_1"
label = "ipcam_COM3"
target_note = "COM3 接收驗證；尚未建立板子永久身分"
auto_open_rx = true
auto_reconnect = false

[channels.adapter]
port = "COM3"

[channels.serial]
baudrate = 115200
bytesize = 8
parity = "none"
stopbits = 1
flow_control = "none"
dtr = false
rts = false
read_timeout_ms = 20
write_timeout_ms = 1000

[[auth.principals]]
id = "local_observer"
token_secret_ref = "env:UART_GATEWAY_TOKEN"
channels = ["ch_uart_1"]
permissions = ["read"]
